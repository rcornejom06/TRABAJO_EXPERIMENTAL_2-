{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transações</title>
    <link rel="stylesheet" href="{% static 'Css/style.css' %}">
</head>
<body>
    <div class="container">
        <header class="header-section">
            <h2>Listagem de Transações</h2>
            <p class="subtitle">Resumo de receitas e despesas</p>
        </header>

        <section class="content-section">
            <ul>
                {% for transacao in transacoes %}
                <li>
                    <a href="{% url 'url_update' transacao.id %}">
                        <div class="transaction-item">
                            <div class="transaction-icon">💰</div>
                            <div class="transaction-details">
                                <span class="transaction-desc">{{ transacao.descricao }}</span>
                                <span class="transaction-category">{{ transacao.categoria }}</span>
                            </div>
                            <span class="transaction-date">{{ transacao.data }}</span>
                            <span class="transaction-value{% if transacao.valor < 0 %} negative{% endif %}">
                                {{ transacao.valor }}
                            </span>
                        </div>
                    </a>
                </li>
                {% endfor %}
            </ul>

            <div class="footer-actions">
                <a href="{% url 'url_nova' %}" class="btn-novo">+ Nova Transação</a>
            </div>
        </section>
    </div>
</body>
</html>
